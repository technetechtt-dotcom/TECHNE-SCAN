name: test
on:
  push:
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm audit --audit-level=high
        working-directory: server
